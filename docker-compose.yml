# Producción: docker compose up -d --build
# Desarrollo: docker compose up -d db  (y npm run dev + npm run worker)
# WhatsApp: docker compose up -d waha  (panel para escanear el QR en http://localhost:3002/dashboard)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: promo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promo}
      POSTGRES_DB: promo
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://promo:${POSTGRES_PASSWORD:-promo}@db:5432/promo
      MEDIA_DIR: /data/media
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      WAHA_WEBHOOK_TOKEN: ${WAHA_WEBHOOK_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://promo:${POSTGRES_PASSWORD:-promo}@db:5432/promo
      MEDIA_DIR: /data/media
      CHROME_PATH: /usr/bin/chromium
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  # WhatsApp HTTP API con el motor GOWS (Go, sin navegador): el más liviano. En ARM: WAHA_IMAGE=devlikeapro/waha:gows-arm-2026.9.1
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:gows-2026.9.1}
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_START_SESSION: default
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_DOWNLOAD_MEDIA: "false"
      # Las respuestas de los clientes van directo a la web por la red interna.
      WHATSAPP_HOOK_URL: http://web:3000/api/waha?token=${WAHA_WEBHOOK_TOKEN:-}
      WHATSAPP_HOOK_EVENTS: message
      # Suelta además, para que Coolify la detecte y la ofrezca en Environment Variables.
      WAHA_WEBHOOK_TOKEN: ${WAHA_WEBHOOK_TOKEN:-}
    # Sólo en la máquina: para el QR, un túnel (ssh -L 3002:localhost:3002 vps) o un dominio con contraseña en Coolify/Caddy.
    ports:
      - "127.0.0.1:${WAHA_PORT:-3002}:3000"
    volumes:
      - waha:/app/.sessions
    mem_limit: 768m

volumes:
  pgdata:
  media:
  waha:
